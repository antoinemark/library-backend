# =============================================================================
# Backend do sistema de empréstimo de livros (somente a API).
# O frontend tem o próprio docker-compose.yml, no repositório biblioteca-web-frontend.
#
# Os dois rodam em containers separados e se enxergam por uma rede Docker compartilhada,
# a "biblioteca-net", que precisa existir (crie uma única vez):
#   docker network create biblioteca-net
#
# Uso (a partir desta pasta):
#   docker compose up -d --build   # builda a imagem e sobe a API
#   docker compose up -d           # reaproveita a imagem existente (ex.: carregada com
#                                  # scripts/load-images.sh); builda só se faltar
#   docker compose logs -f         # acompanha os logs
#   docker compose down            # derruba a API (o H2 é em memória: os dados somem)
#
# Variáveis opcionais (no ambiente ou em um arquivo .env ao lado deste arquivo):
#   BACKEND_PORT              porta do host para a API                    (padrão: 8080)
#   APP_CORS_ALLOWED_ORIGINS  origens liberadas no CORS do backend         (padrão: dev do Vite)
#   JAVA_OPTS                 opções extras da JVM                         (padrão: vazio)
#   BACKEND_TZ                fuso horário (define o "hoje")               (padrão: America/Sao_Paulo)
#
# A API fica em http://localhost:${BACKEND_PORT}. Os outros containers da rede biblioteca-net
# a alcançam por http://library-backend:8080.
# =============================================================================

name: library-backend

services:
  library-backend:
    image: library-backend:latest
    build: .
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      # Mapeado pelo Spring para a propriedade app.cors.allowed-origins. O frontend em container
      # não precisa estar na lista: o Nginx dele repassa /api sem o header Origin.
      APP_CORS_ALLOWED_ORIGINS: "${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:4173}"
      JAVA_OPTS: "${JAVA_OPTS:-}"
      # Fuso horário da JVM: define a "data de hoje" (status, devolução e datas do seed).
      # O Dockerfile já usa America/Sao_Paulo; aqui ele pode ser trocado sem rebuildar a imagem.
      TZ: "${BACKEND_TZ:-America/Sao_Paulo}"
    networks:
      - biblioteca-net
    restart: unless-stopped

networks:
  biblioteca-net:
    external: true
    name: biblioteca-net
