spring.application.name=library
spring.datasource.url=jdbc:h2:mem:library
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=admin

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.defer-datasource-initialization=true

# Console do H2 em http://localhost:8080/h2-console (JDBC URL jdbc:h2:mem:library, usuario e senha acima).
# No Spring Boot 4 ele depende do modulo spring-boot-h2console (declarado no pom.xml).
# Por padrao so aceita conexoes da propria maquina (spring.h2.console.settings.web-allow-others=false).
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Origens liberadas no CORS (lista separada por virgula)
app.cors.allowed-origins=http://localhost:5173,http://localhost:4173

# Considera os headers X-Forwarded-* enviados por um proxy (Nginx do frontend, proxy do Vite),
# para que o header Location dos 201 aponte para a URL publica (ex.: http://localhost:8081/api/authors/1).
# Requisicoes diretas na porta do backend (sem esses headers) nao sao afetadas.
server.forward-headers-strategy=framework
